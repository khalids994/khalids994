<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saudifitx · تجربة ١٤ يوم</title>
<style>
  /* Brand: Saudifitx Design System — Baloo Bhaijaan 2 (display: 800, UI: 500), teal #0B2D33, one accent #2AF45F */
  @font-face { font-family: "Baloo Bhaijaan 2"; font-weight: 500; font-display: block; src: url(fonts/BalooBhaijaan2-Medium.ttf) format("truetype"); }
  @font-face { font-family: "Baloo Bhaijaan 2"; font-weight: 700; font-display: block; src: url(fonts/BalooBhaijaan2-Bold.ttf) format("truetype"); }
  @font-face { font-family: "Baloo Bhaijaan 2"; font-weight: 800; font-display: block; src: url(fonts/BalooBhaijaan2-ExtraBold.ttf) format("truetype"); }

  :root {
    --teal: #0B2D33; --teal-soft: #0D3235; --elev: #11383D;
    --green: #2AF45F; --green-bright: #57C96F;
    --fg: #fff; --muted: rgba(255,255,255,.72); --subtle: rgba(255,255,255,.5);
    --border: rgba(255,255,255,.10);
    --font: "Baloo Bhaijaan 2", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: var(--font); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--teal); color: var(--fg); transform-origin: center; }
  .scene { position: absolute; inset: 0; display: none; }
  .r { position: absolute; right: 80px; left: 80px; text-align: right; white-space: nowrap; }
  .d { font-weight: 800; line-height: 1.1; }             /* display */
  .u { font-weight: 500; color: var(--muted); }          /* UI */
  .g { color: var(--green); }
  .mask { overflow: hidden; }
  .mask > span { display: inline-block; }

  /* A — chaos */
  .w { position: absolute; white-space: nowrap; font-weight: 700; transform-origin: center; }
  .w.chip { background: var(--fg); color: var(--teal); border-radius: 999px; padding: 0 .45em; }
  #line { position: absolute; height: 12px; top: 954px; background: var(--green); border-radius: 12px; }
  #lost { top: 640px; font-size: 280px; }

  /* B — 14 */
  #trial { top: 250px; font-size: 130px; }
  #num { position: absolute; left: -40px; top: 330px; font-size: 900px; font-weight: 800; line-height: 1; color: var(--green); direction: rtl; }
  #yom { top: 1330px; font-size: 200px; }

  /* C — focus */
  #rest { top: 660px; font-size: 130px; }
  #focus { top: 820px; font-size: 270px; }
  #fline { position: absolute; right: 80px; top: 1170px; height: 12px; background: var(--green); border-radius: 12px; }

  /* D — tracker */
  #dTitle { top: 200px; font-size: 120px; }
  #dSub { top: 350px; font-size: 66px; }
  #days { position: absolute; top: 500px; left: 80px; right: 80px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
  .day { height: 180px; border-radius: 24px; background: var(--elev); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 88px; font-weight: 800; color: var(--subtle); position: relative; overflow: hidden; }
  .day .f { position: absolute; inset: 0; background: var(--green); transform-origin: bottom; }
  .day .n { position: relative; }
  .day:nth-child(13) { grid-column: 2; }
  #dayNum { top: 1400px; font-size: 300px; }
  #dayNum .u { font-size: 120px; color: var(--fg); font-weight: 800; }

  /* E — habits */
  .card { position: absolute; inset: 0; background: var(--teal); }
  .card .step { top: 200px; font-size: 72px; }
  .card .ic { position: absolute; right: 80px; top: 420px; width: 360px; height: 360px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
  .card .ic svg { width: 190px; height: 190px; stroke: var(--teal); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { top: 880px; font-size: 150px; }
  .card p { top: 1080px; font-size: 80px; }
  .card.alt .ic { right: auto; left: 80px; }
  .card.alt .big { left: auto; right: -60px; }
  .card.inv { background: var(--green); color: var(--teal); }
  .card.inv .u { color: rgba(11,45,51,.75); }
  .card.inv .ic { background: var(--teal); }
  .card.inv .ic svg { stroke: var(--green); }
  .card.inv .big { color: rgba(11,45,51,.12); }
  .card .big { position: absolute; left: -60px; bottom: -120px; font-size: 900px; font-weight: 800; line-height: 1; color: var(--elev); }

  /* F — statement */
  #s1 { top: 560px; font-size: 170px; } #s2 { top: 760px; font-size: 170px; } #s3 { top: 960px; font-size: 170px; }
  #sline { position: absolute; right: 80px; top: 1230px; height: 12px; background: var(--green); border-radius: 12px; }

  /* G — end card (signature gradient, brand template layout) */
  #grad { position: absolute; inset: 0; background: radial-gradient(120% 90% at 0% 100%, var(--green-bright) 0%, var(--teal-soft) 45%, var(--teal) 75%); }
  #logo { position: absolute; left: 80px; top: 180px; width: 740px; height: 209px; }
  #logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #c1 { top: 760px; font-size: 130px; } #c2 { top: 900px; font-size: 220px; }
  #btn { position: absolute; right: 80px; top: 1250px; padding: 30px 100px; border-radius: 999px; background: var(--green); color: var(--teal); font-size: 90px; font-weight: 800; line-height: 1.3; white-space: nowrap; }
  #social { position: absolute; left: 80px; bottom: 120px; height: 96px; }

  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; direction: ltr; }
  #controls button { font: 700 15px var(--font); padding: 8px 18px; border-radius: 999px; border: 0; background: var(--green); color: var(--teal); cursor: pointer; }
  body.capture #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="A">
    <div id="chaos" style="position:absolute;inset:0"></div>
    <div id="line"></div>
    <div class="r d mask" id="lost"><span>مشتّت؟</span></div>
  </section>

  <section class="scene" id="Bs">
    <div class="r d mask" id="trial"><span>تجربة</span></div>
    <div id="num">١</div>
    <div class="r d mask" id="yom"><span>يوم</span></div>
  </section>

  <section class="scene" id="C">
    <div class="r d mask" id="rest"><span>لاستعادة</span></div>
    <div class="r d g" id="focus">التركيز</div>
    <div id="fline"></div>
  </section>

  <section class="scene" id="D">
    <div class="r d mask" id="dTitle"><span>يوم بيوم</span></div>
    <div class="r u mask" id="dSub"><span>عادة صغيرة كل يوم</span></div>
    <div id="days"></div>
    <div class="r d g" id="dayNum">١</div>
  </section>

  <section class="scene" id="E"></section>

  <section class="scene" id="F">
    <div class="r d mask" id="s1"><span>عادة وحدة.</span></div>
    <div class="r d mask" id="s2"><span>كل يوم.</span></div>
    <div class="r d g mask" id="s3"><span>١٤ يوم.</span></div>
    <div id="sline"></div>
  </section>

  <section class="scene" id="G">
    <div id="grad"></div>
    <div id="logo"><img id="logoW" src="assets/logo-white.png" alt=""><img id="logoG" src="assets/logo-green.png" alt=""></div>
    <div class="r d mask" id="c1"><span>جاهز تستعيد</span></div>
    <div class="r d g mask" id="c2"><span>تركيزك؟</span></div>
    <div id="btn">ابدأ التحدي</div>
    <img id="social" src="assets/social-row.png" alt="@saudifitx">
  </section>
</div>

<div id="controls"><button id="play">▶ Play</button><button id="replay">↻ Replay</button></div>
<audio id="score" src="score.wav" preload="auto"></audio>

<script>
// ───────────────────────── Render contract: seek(t) paints the frame at t. Pure; no state between frames.
const $ = id => document.getElementById(id);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const out = k => 1 - Math.pow(1 - k, 5);                         // brand entrance ease, no overshoot
const io = k => k < .5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2;
const decay = (t, t0, len) => t < t0 ? 0 : Math.exp(-(t - t0) / len);   // beat-hit envelope

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (i, n) => mulberry32(i * 7919 + n * 104729 + 1)();    // seeded per-(item, step) noise

let BEATS = null;  // measured grid from beats.json, set once at load
const B = i => BEATS[Math.min(i, BEATS.length - 1)] + Math.max(0, i - BEATS.length + 1) * .5;
const BEAT = () => B(1) - B(0);
const DURATION = 20;

function css(el, { x = 0, y = 0, s = 1, sx = s, sy = s, o = 1, blur = 0, base = "" }) {
  el.style.transform = `${base} translate(${x}px,${y}px) scale(${sx},${sy})`;
  el.style.opacity = o;
  el.style.filter = blur > .05 ? `blur(${blur}px)` : "none";
}
// mask reveal: inner span rises from below its own line box
function reveal(el, t, t0, dur = .28) {
  const k = out(p(t, t0, t0 + dur));
  el.style.visibility = t >= t0 ? "visible" : "hidden";
  el.firstElementChild.style.transform = `translateY(${lerp(105, 0, k)}%)`;
}
const scene = (id, t, a, b) => { const on = t >= a && t < b; $(id).style.display = on ? "block" : "none"; return on; };

// ── static layout built once (deterministic)
const WORDS = ["إشعار", "رسالة جديدة", "٩٩+", "تمرير", "فيديو قصير", "تنبيه", "بث مباشر", "@منشن", "ريلز", "لايك", "٣ رسائل", "تحديث", "ستوري", "إعلان", "١٢+", "تعليق", "قروب", "مكالمة فائتة"];
const rng = mulberry32(14);
const CHAOS = WORDS.map((w, i) => ({
  w, appear: (r => i < 6 ? i * .03 : .18 + r * .6)(rng()), x: 40 + rng() * 760, y: 160 + rng() * 1540,
  size: 70 + rng() * 80, rot: (rng() - .5) * 16, chip: rng() < .35,
}));
$("chaos").innerHTML = CHAOS.map(c => `<div class="w${c.chip ? " chip" : ""}" style="left:${c.x}px;top:${c.y}px;font-size:${c.size | 0}px">${c.w}</div>`).join("");
const chaosEls = [...$("chaos").children];

$("days").innerHTML = Array.from({ length: 14 }, (_, i) => `<div class="day"><div class="f"></div><span class="n">${AR(i + 1)}</span></div>`).join("");
const dayEls = [...$("days").children];

const HABITS = [
  ["نوم أعمق", "روتين ثابت قبل النوم", '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'],
  ["حركة يومية", "٣٠ دقيقة تنشّط عقلك", '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'],
  ["ديتوكس رقمي", "وقت أقل على الشاشة", '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M3 3l18 18"/>'],
  ["تنفّس وصفاء", "٥ دقائق كل صباح", '<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>'],
];
$("E").innerHTML = HABITS.map(([h, s, ic], i) => `<div class="card${i % 2 ? " alt" : ""}${i === 2 ? " inv" : ""}" id="h${i}">
  <div class="big">${AR(i + 1)}</div>
  <div class="r u step">عادة ${AR(i + 1)} من ٤</div>
  <div class="ic"><svg viewBox="0 0 24 24">${ic}</svg></div>
  <h3 class="r d">${h}</h3><p class="r u">${s}</p></div>`).join("");
const cards = HABITS.map((_, i) => $("h" + i));

function seek(t) {
  // A — chaos → snap to the focus line → "مشتّت؟"   [0, B4)
  if (scene("A", t, 0, B(4))) {
    const snap = B(2), k = io(p(t, snap, snap + .18));
    CHAOS.forEach((c, i) => {
      const el = chaosEls[i], shown = t >= c.appear && k < 1;
      el.style.visibility = shown ? "visible" : "hidden";
      if (!shown) return;
      const step = Math.floor(t * 15);                              // 15 Hz jitter, seeded
      const jx = (hash(i, step) - .5) * 18, jy = (hash(i + 99, step) - .5) * 18;
      const pop = 1 + .25 * decay(t, c.appear, .05);
      const w = el.offsetWidth, h = el.offsetHeight;
      const cx = 540 - (c.x + w / 2), cy = 960 - (c.y + h / 2);
      css(el, { x: lerp(jx, cx, k), y: lerp(jy, cy, k), sx: pop * (1 - .6 * k), sy: pop * (1 - k), base: `rotate(${c.rot * (1 - k)}deg)` });
    });
    const amp = 4 + 22 * p(t, 0, snap) ** 2, st = Math.floor(t * 24);  // seeded camera shake, builds to the snap
    css($("chaos"), { x: t < snap ? (hash(501, st) - .5) * amp : 0, y: t < snap ? (hash(502, st) - .5) * amp : 0 });
    const lw = io(p(t, snap + .08, snap + .26)) * 920;
    $("line").style.width = lw + "px";
    $("line").style.left = (540 - lw / 2) + "px";
    css($("line"), { y: out(p(t, B(3) - .1, B(3) + .2)) * 230, sy: 1 + 1.5 * decay(t, snap + .26, .08) });
    reveal($("lost"), t, B(2) + .2, .3);
    css($("lost"), { s: 1 + .05 * decay(t, B(3), .15) });
    $("lost").style.transformOrigin = "right center";
  }

  // B — تجربة / ١٤ counts on 16ths / يوم   [B4, B10)
  if (scene("Bs", t, B(4), B(10))) {
    reveal($("trial"), t, B(4));
    const T0 = B(5), step = BEAT() / 4;
    const k = t < T0 ? 0 : Math.min(13, Math.floor((t - T0) / step) + 1);
    $("num").textContent = AR(1 + k);
    const lastTick = k === 0 ? B(4) : T0 + (k - 1) * step;
    const land = decay(t, B(8), .18);
    const roll = k === 0 ? 0 : 1 - out(p(t, lastTick, lastTick + .06));   // new digit rolls up into place
    css($("num"), { x: lerp(-200, 0, out(p(t, B(4), B(4) + .4))), y: roll * 90, s: 1 + .08 * land, o: out(p(t, B(4), B(4) + .15)) * (1 - .3 * roll) });
    reveal($("yom"), t, B(8) - .06);
  }

  // C — لاستعادة / التركيز rack focus / line   [B10, B12)
  if (scene("C", t, B(10), B(12))) {
    reveal($("rest"), t, B(10));
    const f = io(p(t, B(10), B(11)));
    css($("focus"), { blur: (1 - f) * 40, s: lerp(1.18, 1, f) + .04 * decay(t, B(11), .15), o: lerp(.35, 1, f) });
    $("fline").style.width = io(p(t, B(11), B(11) + .3)) * 920 + "px";
  }

  // D — tracker: one day fills per 8th note   [B12, B20)
  if (scene("D", t, B(12), B(20))) {
    reveal($("dTitle"), t, B(12));
    reveal($("dSub"), t, B(12) + .12);
    let filled = 0;
    dayEls.forEach((el, i) => {
      const ti = B(12) + i * BEAT() / 2, k = out(p(t, ti, ti + .12));
      if (t >= ti) filled = i + 1;
      el.firstElementChild.style.transform = `scaleY(${k})`;
      el.style.color = k > .5 ? "var(--teal)" : "";
      css(el, { s: 1 + .06 * decay(t, ti, .08) + .05 * decay(t, B(19), .15) });
    });
    $("dayNum").innerHTML = `<span class="u">${t >= B(19) ? "تم" : "اليوم"}</span> ${AR(Math.max(1, filled))}`;
    css($("dayNum"), { s: 1 + .05 * decay(t, B(12) + (Math.max(1, filled) - 1) * BEAT() / 2, .08) + .1 * decay(t, B(19), .2) });
    $("dayNum").style.transformOrigin = "right center";
  }

  // E — habits: push-cut into each card on the beat   [B20, B28)
  if (scene("E", t, B(20), B(28))) {
    cards.forEach((el, i) => {
      const tin = B(20 + 2 * i), tout = B(22 + 2 * i);
      const kin = i === 0 ? 1 : out(p(t, tin - .2, tin)), kout = i === 3 ? 0 : out(p(t, tout - .2, tout));
      const on = t >= tin - .2 && (i === 3 || t < tout);
      el.style.visibility = on ? "visible" : "hidden";
      if (!on) return;
      css(el, { x: lerp(-1080, 0, kin) + kout * 1080 });
      const ic = el.querySelector(".ic");
      css(ic, { s: lerp(.6, 1, out(p(t, tin, tin + .3))) + .05 * decay(t, tin, .12) });
      el.querySelectorAll("path,rect").forEach(pth => {
        const len = pth.getTotalLength();
        pth.style.strokeDasharray = len;
        pth.style.strokeDashoffset = len * (1 - io(p(t, tin + .05, tin + .45)));
      });
      css(el.querySelector(".big"), { y: lerp(200, 0, out(p(t, tin - .2, tin + .6))) });
    });
  }

  // F — statement, one line per beat, line draws into the logo   [B28, B32)
  if (scene("F", t, B(28), B(32))) {
    reveal($("s1"), t, B(28) - .06);
    reveal($("s2"), t, B(29) - .06);
    const sk = out(p(t, B(30) - .12, B(30)));
    $("s3").style.visibility = t >= B(30) - .12 ? "visible" : "hidden";
    $("s3").firstElementChild.style.transform = "none";
    css($("s3"), { s: lerp(1.9, 1, sk) + .05 * decay(t, B(30), .15), o: sk });
    $("s3").style.transformOrigin = "right center";
    $("sline").style.width = io(p(t, B(30), B(32))) * 920 + "px";
  }

  // G — end card   [B32, end]
  if (scene("G", t, B(32), 1e9)) {
    css($("grad"), { o: .6 + .4 * out(p(t, B(32), B(34))) });
    const wk = out(p(t, B(32), B(32) + .35));
    $("logoW").style.clipPath = `inset(0 ${(1 - wk) * 100}% 0 0)`;
    const gk = out(p(t, B(33) - .1, B(33) + .15));
    const flick = Math.sin(p(t, B(33), B(33) + .35) * Math.PI);
    css($("logoG"), { x: flick * 8, y: lerp(40, 0, gk) - flick * 22, o: gk });
    reveal($("c1"), t, B(34) - .06);
    reveal($("c2"), t, B(35) - .06);
    const bk = out(p(t, B(36) - .1, B(36) + .2));
    $("btn").style.clipPath = `inset(0 0 0 ${(1 - bk) * 100}%)`;
    css($("btn"), { s: 1 + .04 * decay(t, B(36), .12) + .04 * decay(t, B(38), .15) });
    $("btn").style.transformOrigin = "right center";
    const sk = out(p(t, B(37), B(37) + .35));
    css($("social"), { x: lerp(-60, 0, sk), o: sk });
  }
}

// ───────────────────────── playback shell (outside the render contract)
window.DURATION = DURATION;
window.seek = seek;
const capture = new URLSearchParams(location.search).has("capture");
if (capture) document.body.classList.add("capture");
function fit() {
  if (capture) return;
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  $("stage").style.transform = `scale(${s})`;
  $("stage").style.margin = `${(1920 * s - 1920) / 2}px ${(1080 * s - 1080) / 2}px`;
}
addEventListener("resize", fit); fit();

const audio = $("score");
function tick() { seek(audio.currentTime); if (!audio.paused) requestAnimationFrame(tick); }
$("play").onclick = () => { if (audio.paused) { audio.play(); $("play").textContent = "❚❚ Pause"; requestAnimationFrame(tick); } else { audio.pause(); $("play").textContent = "▶ Play"; } };
$("replay").onclick = () => { audio.currentTime = 0; if (audio.paused) $("play").click(); };
audio.onended = () => { $("play").textContent = "▶ Play"; };

fetch("beats.json").then(r => r.json()).then(j => j.beats)
  .catch(() => Array.from({ length: 40 }, (_, i) => i * .5))       // file:// fallback: nominal 120 BPM grid
  .then(beats => {
    BEATS = beats; window.BEATS = beats;
    return Promise.all([document.fonts.load('800 100px "Baloo Bhaijaan 2"'), document.fonts.load('500 100px "Baloo Bhaijaan 2"'),
      document.fonts.load('700 100px "Baloo Bhaijaan 2"'), ...[...document.images].map(i => i.decode().catch(() => {}))]);
  })
  .then(() => { seek(0); window.ready = true; });
</script>
</body>
</html>
