<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saudifitx · تجربة ١٤ يوم</title>
<style>
  /* Brand: Saudifitx Design System — Baloo Bhaijaan 2, teal #0B2D33, green #2AF45F */
  @font-face { font-family: "Baloo Bhaijaan 2"; font-weight: 500; font-display: block; src: url(fonts/BalooBhaijaan2-Medium.ttf) format("truetype"); }
  @font-face { font-family: "Baloo Bhaijaan 2"; font-weight: 700; font-display: block; src: url(fonts/BalooBhaijaan2-Bold.ttf) format("truetype"); }
  @font-face { font-family: "Baloo Bhaijaan 2"; font-weight: 800; font-display: block; src: url(fonts/BalooBhaijaan2-ExtraBold.ttf) format("truetype"); }

  :root {
    --brand-teal: #0B2D33;
    --brand-teal-soft: #0D3235;
    --brand-teal-deep: #082226;
    --brand-green: #2AF45F;
    --brand-green-bright: #57C96F;
    --bg-elevated: #11383D;
    --fg: #FFFFFF;
    --fg-muted: rgba(255,255,255,0.72);
    --fg-subtle: rgba(255,255,255,0.50);
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.22);
    --shadow-md: 0 6px 16px rgba(0,0,0,0.28);
    --shadow-inset-hi: inset 0 1px 0 rgba(255,255,255,0.10);
    --shadow-green-glow: 0 8px 28px rgba(42,244,95,0.35);
    --font: "Baloo Bhaijaan 2", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: var(--font); }

  /* 9:16 story frame — 120px top/bottom safe area, 80px sides */
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--brand-teal); color: var(--fg); transform-origin: center; }
  #grad { position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 0% 100%, var(--brand-green-bright) 0%, var(--brand-teal-soft) 45%, var(--brand-teal) 75%); }
  .abs { position: absolute; left: 80px; right: 80px; text-align: center; will-change: transform, opacity; }

  /* persistent frame, as in the post template: logo top-left, social row bottom-left */
  #logo { position: absolute; width: 1057px; height: 299px; left: 0; top: 0; transform-origin: 0 0; }
  #logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #social { position: absolute; left: 80px; bottom: 120px; height: 96px; }

  #kicker { top: 400px; font-size: 104px; font-weight: 700; color: var(--fg-muted); }
  #bigNum { top: 600px; font-size: 560px; font-weight: 800; line-height: 1; color: var(--brand-green); letter-spacing: -0.02em; }
  #dayWord { top: 1230px; font-size: 150px; font-weight: 800; }

  #focusText { top: 790px; font-size: 130px; font-weight: 800; line-height: 1.2; }
  #focusText b { display: block; color: var(--brand-green); font-size: 200px; font-weight: 800; }
  .ring { position: absolute; left: 50%; top: 1000px; border-radius: 50%; border: 2px solid var(--border-strong); }
  #ring3 { border-color: var(--brand-green); }

  #daysTitle { top: 420px; font-size: 96px; font-weight: 800; line-height: 1.2; }
  #daysTitle span { display: block; font-size: 60px; font-weight: 500; color: var(--fg-muted); }
  #days { position: absolute; top: 700px; left: 80px; right: 80px; display: grid;
    grid-template-columns: repeat(4, 1fr); gap: 32px; }
  .day { height: 180px; border-radius: 24px; background: var(--bg-elevated); border: 1px solid var(--border);
    box-shadow: var(--shadow-md), var(--shadow-inset-hi);
    display: grid; place-items: center; font-size: 84px; font-weight: 800; color: var(--fg-subtle);
    position: relative; overflow: hidden; }
  .day .fill { position: absolute; inset: 0; background: var(--brand-green); transform-origin: bottom; transform: scaleY(0); }
  .day .n { position: relative; }
  .day:nth-child(13) { grid-column: 2; }
  #bar { position: absolute; top: 1560px; left: 80px; right: 80px; height: 20px; border-radius: 999px; background: var(--border); overflow: hidden; }
  #barFill { position: absolute; right: 0; top: 0; bottom: 0; background: var(--brand-green); border-radius: 999px; }
  #pct { top: 1600px; font-size: 60px; font-weight: 800; color: var(--brand-green); }

  #pillTitle { top: 360px; font-size: 100px; font-weight: 800; }
  .card { position: absolute; left: 80px; right: 80px; height: 230px; border-radius: 24px;
    background: var(--bg-elevated); border: 1px solid var(--border); box-shadow: var(--shadow-md), var(--shadow-inset-hi);
    display: flex; align-items: center; gap: 48px; padding: 0 56px; }
  .card .ic { width: 128px; height: 128px; border-radius: 999px; background: var(--brand-green); display: grid; place-items: center; flex: none; }
  .card .ic svg { width: 64px; height: 64px; stroke: var(--brand-teal); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { font-size: 80px; font-weight: 800; line-height: 1.15; }
  .card p { font-size: 46px; font-weight: 500; color: var(--fg-muted); line-height: 1.3; }

  #ctaA { top: 700px; font-size: 128px; font-weight: 800; line-height: 1.2; }
  #ctaA b { color: var(--brand-green); font-weight: 800; }
  #ctaSub { top: 1060px; font-size: 56px; font-weight: 500; color: var(--fg-muted); }
  #ctaBtn { position: absolute; left: 50%; top: 1240px; padding: 34px 110px; border-radius: 999px;
    background: var(--brand-green); color: var(--brand-teal); font-size: 84px; font-weight: 800; white-space: nowrap;
    box-shadow: var(--shadow-green-glow); line-height: 1.3; }

  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; direction: ltr; }
  #controls button { font: 700 15px var(--font); padding: 8px 18px; border-radius: 999px; border: 0; background: var(--brand-green); color: var(--brand-teal); cursor: pointer; }
  body.capture #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="grad"></div>

  <!-- Scene 2: تجربة ١٤ يوم -->
  <div class="abs" id="kicker">تجربة</div>
  <div class="abs" id="bigNum">١</div>
  <div class="abs" id="dayWord">يوم</div>

  <!-- Scene 3: لاستعادة التركيز -->
  <div class="ring" id="ring1"></div>
  <div class="ring" id="ring2"></div>
  <div class="ring" id="ring3"></div>
  <div class="abs" id="focusText">لاستعادة<b>التركيز</b></div>

  <!-- Scene 4: 14-day tracker -->
  <div class="abs" id="daysTitle">يوم بيوم<span>عادة صغيرة كل يوم… وتركيزك يرجع</span></div>
  <div id="days"></div>
  <div id="bar"><div id="barFill"></div></div>
  <div class="abs" id="pct">٠٪</div>

  <!-- Scene 5: daily habits (Lucide icons) -->
  <div class="abs" id="pillTitle">٤ عادات يومية</div>
  <div class="card" id="c0"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></div><div><h3>نوم أعمق</h3><p>روتين ثابت قبل النوم</p></div></div>
  <div class="card" id="c1"><div class="ic"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div><h3>حركة يومية</h3><p>٣٠ دقيقة تنشّط عقلك</p></div></div>
  <div class="card" id="c2"><div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M3 3l18 18"/></svg></div><div><h3>ديتوكس رقمي</h3><p>وقت أقل على الشاشة</p></div></div>
  <div class="card" id="c3"><div class="ic"><svg viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg></div><div><h3>تنفّس وصفاء</h3><p>٥ دقائق كل صباح</p></div></div>

  <!-- Scene 6: CTA -->
  <div class="abs" id="ctaA">جاهز تستعيد<br><b>تركيزك؟</b></div>
  <div class="abs" id="ctaSub">١٤ يوم. عادة وحدة كل يوم.</div>
  <div id="ctaBtn">ابدأ التحدي</div>

  <!-- persistent brand frame -->
  <div id="logo"><img id="logoWhite" src="assets/logo-white.png" alt=""><img id="logoGreen" src="assets/logo-green.png" alt=""></div>
  <img id="social" src="assets/social-row.png" alt="@saudifitx">
</div>

<div id="controls"><button id="replay">↻ Replay</button><button id="pause">❚❚ Pause</button></div>

<script>
const DURATION = 20; // seconds
const $ = id => document.getElementById(id);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
// brand easing: smooth ease-out for entrances (≈ cubic-bezier(0.22,1,0.36,1)), no overshoot
const ease = k => 1 - Math.pow(1 - k, 4);
const inOut = k => k < .5 ? 8 * k ** 4 : 1 - Math.pow(-2 * k + 2, 4) / 2;
// visibility window: fade in over [a, a+fi], out over [b-fo, b]
const win = (t, a, b, fi = .6, fo = .4) => Math.min(ease(p(t, a, a + fi)), 1 - p(t, b - fo, b));
// brand entrance: fade + small upward rise
const rise = (el, t, a, o = 1, dist = 24, dur = .7) => set(el, { y: lerp(dist, 0, ease(p(t, a, a + dur))), o: Math.min(o, ease(p(t, a, a + dur))) });

function set(el, { x = 0, y = 0, s = 1, o = 1, blur = 0, base = "" }) {
  el.style.transform = `${base} translate(${x}px, ${y}px) scale(${s})`;
  el.style.opacity = o;
  el.style.filter = blur ? `blur(${blur}px)` : "none";
}

$("days").innerHTML = Array.from({ length: 14 }, (_, i) => `<div class="day"><div class="fill"></div><span class="n">${AR(i + 1)}</span></div>`).join("");
const cells = [...document.querySelectorAll(".day")];

// logo positions: centered hero → top-left header (template placement)
const LOGO_W = 1057, LOGO_H = 299;
const HERO = { s: .8, x: (1080 - LOGO_W * .8) / 2, y: (1920 - LOGO_H * .8) / 2 };
const HEAD = { s: .36, x: 80, y: 120 };
const CTA = { s: .66, x: (1080 - LOGO_W * .66) / 2, y: 300 };

function render(t) {
  // signature gradient breathes slightly
  $("grad").style.opacity = .55 + .25 * Math.sin(t * .6);

  // ── Logo: hero reveal → arrow flick → docks top-left; returns to hero for the CTA
  {
    const inW = ease(p(t, .2, 1.0));      // white type rises in
    const inG = ease(p(t, .5, 1.3));      // green S + arrow
    const flick = Math.sin(p(t, 1.3, 1.75) * Math.PI);   // brief upward flick, settles back
    const dock = inOut(p(t, 2.3, 3.0));
    const back = inOut(p(t, 17.0, 17.6));
    const from = back > 0 ? HEAD : HERO, to = back > 0 ? CTA : HEAD, k = back > 0 ? back : dock;
    const s = lerp(from.s, to.s, k), x = lerp(from.x, to.x, k), y = lerp(from.y, to.y, k);
    $("logo").style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    set($("logoWhite"), { y: lerp(30, 0, inW), o: inW });
    set($("logoGreen"), { x: flick * 10, y: lerp(30, 0, inG) - flick * 26, o: inG });
    set($("social"), { y: lerp(24, 0, ease(p(t, 2.6, 3.3))), o: ease(p(t, 2.6, 3.3)) });
  }

  // ── Scene 2: تجربة ١٤ يوم (3.0 – 6.6)
  {
    const o = win(t, 3.0, 6.6);
    rise($("kicker"), t, 3.0, o);
    const kc = inOut(p(t, 3.2, 4.6));
    $("bigNum").textContent = AR(Math.max(1, Math.round(kc * 14)));
    set($("bigNum"), { y: lerp(40, 0, ease(p(t, 3.2, 3.9))), s: lerp(.92, 1, ease(p(t, 3.2, 4.6))), o: Math.min(o, ease(p(t, 3.2, 3.8))) });
    rise($("dayWord"), t, 4.5, o);
  }

  // ── Scene 3: لاستعادة التركيز (6.6 – 10.0)
  {
    const o = win(t, 6.6, 10.0, .4);
    const f = inOut(p(t, 6.7, 8.0));
    set($("focusText"), { s: lerp(1.12, 1, f), blur: (1 - f) * 24, o });
    ["ring1", "ring2", "ring3"].forEach((id, i) => {
      const k = inOut(p(t, 6.6 + i * .15, 8.1 + i * .1));
      const el = $(id), d = lerp(2000 - i * 250, 900 - i * 160, k);
      el.style.width = el.style.height = d + "px";
      set(el, { base: "translate(-50%, -50%)", o: o * (i === 2 ? .7 : .5) });
    });
  }

  // ── Scene 4: 14-day tracker (10.0 – 14.2)
  {
    const o = win(t, 10.0, 14.2);
    rise($("daysTitle"), t, 10.0, o);
    cells.forEach((c, i) => {
      const a = ease(p(t, 10.1 + i * .035, 10.7 + i * .035));
      set(c, { y: lerp(24, 0, a), o: Math.min(a, o) });
      const fk = ease(p(t, 10.8 + i * .17, 11.1 + i * .17));
      c.firstChild.style.transform = `scaleY(${fk})`;
      c.style.color = fk > .5 ? "var(--brand-teal)" : "";
    });
    const prog = p(t, 10.8, 13.4);
    set($("bar"), { o });
    $("barFill").style.width = prog * 100 + "%";
    $("pct").textContent = AR(Math.round(prog * 100)) + "٪";
    set($("pct"), { o });
  }

  // ── Scene 5: habits (14.2 – 17.2)
  {
    const o = win(t, 14.2, 17.2, .5, .35);
    rise($("pillTitle"), t, 14.2, o);
    for (let i = 0; i < 4; i++) {
      const el = $("c" + i);
      el.style.top = 580 + i * 265 + "px";
      const k = ease(p(t, 14.4 + i * .22, 15.1 + i * .22));
      set(el, { y: lerp(40, 0, k), o: Math.min(o, k) });
    }
  }

  // ── Scene 6: CTA (17.4 – 20)
  {
    rise($("ctaA"), t, 17.5);
    rise($("ctaSub"), t, 17.9);
    const b = ease(p(t, 18.3, 19.0));
    set($("ctaBtn"), { base: "translateX(-50%)", y: lerp(24, 0, b), o: b });
  }
}

// ── playback / capture
window.DURATION = DURATION;
window.render = render;
const capture = new URLSearchParams(location.search).has("capture");
if (capture) document.body.classList.add("capture");

function fit() {
  if (capture) return;
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  $("stage").style.transform = `scale(${s})`;
  $("stage").style.margin = `${(1920 * s - 1920) / 2}px ${(1080 * s - 1080) / 2}px`;
}
addEventListener("resize", fit); fit();

const LOOP = DURATION + 1.5;
let start = null, paused = false, pauseAt = 0;
function loop(now) {
  if (start === null) start = now;
  render(Math.min(paused ? pauseAt : ((now - start) / 1000) % LOOP, DURATION));
  requestAnimationFrame(loop);
}
$("replay").onclick = () => { start = null; paused = false; $("pause").textContent = "❚❚ Pause"; };
$("pause").onclick = () => {
  if (!paused) { pauseAt = ((performance.now() - start) / 1000) % LOOP; paused = true; $("pause").textContent = "▶ Play"; }
  else { start = performance.now() - pauseAt * 1000; paused = false; $("pause").textContent = "❚❚ Pause"; }
};
render(0);
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))])
  .then(() => { if (!capture) requestAnimationFrame(loop); window.ready = true; });
</script>
</body>
</html>
